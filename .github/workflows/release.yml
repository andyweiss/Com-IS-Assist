name: Release

# Builds the VST3 for macOS, Windows and Linux and attaches them to the GitHub release.
#
# Triggered by pushing a `v*` tag, which is what "draft a new release" does when you publish it.
# The tag is also the version: it is passed through as COMIS_RELEASE_VERSION, which `build.rs`
# stamps into the plugin's help page. A build made any other way reports "dev build" instead, so a
# published artifact can always be told apart from a local one.

on:
  push:
    tags: ['v*']
  # Lets the build be exercised without cutting a release. Nothing is published in that case, and
  # the artifacts report themselves as dev builds, because they are.
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,  os: macos-latest   }
          - { name: windows-x64,  os: windows-latest }
          - { name: linux-x64,    os: ubuntu-22.04   }
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # baseview/egui/winit need these to build on Linux. The first three lines are nih-plug's own
      # CI list; the rest were added because that list alone is not sufficient here - the `x11`
      # crate's build script runs `pkg-config gl`, and `libgl-dev` on ubuntu-22.04 does not provide
      # `gl.pc`. `mesa-common-dev`/`libgl1-mesa-dev` do.
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            pkg-config mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxkbcommon-x11-dev libwayland-dev

      # Fails here with a readable message rather than two minutes into a compile with a build
      # script panic, which is how this list came to be wrong in the first place.
      - name: Verify the pkg-config packages the build needs are present
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          missing=()
          for pkg in gl x11 xcb xcursor xkbcommon; do
            pkg-config --exists "$pkg" || missing+=("$pkg")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::missing pkg-config packages: ${missing[*]}"
            exit 1
          fi
          echo "gl $(pkg-config --modversion gl), x11 $(pkg-config --modversion x11)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build and bundle the VST3
        env:
          # Empty on workflow_dispatch, which build.rs treats as unset - hence "dev build".
          COMIS_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          # The oldest macOS this will load on. Only affects the macOS runner.
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: cargo xtask bundle com-is-assist-vst3 --release

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: Com-IS-Assist-${{ matrix.name }}
          path: target/bundled/
          if-no-files-found: error

  publish:
    name: Attach builds to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # Needed to create/update the release and upload assets to it.
      contents: write
    steps:
      - name: Download every platform's bundle
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One zip per platform. `actions/download-artifact` unpacks what `upload-artifact` zipped, so
      # the archives are rebuilt here rather than passed through - that way each one is named for
      # its platform and contains the .vst3 bundle at its root.
      - name: Zip each platform's bundle
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release/$name.zip" .)
          done
          ls -l release

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          # Keeps whatever release notes were drafted for the tag.
          fail_on_unmatched_files: true
