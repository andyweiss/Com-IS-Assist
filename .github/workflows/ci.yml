name: CI

# Deployment is Linux (Specs/TechnicalConcept.md section 1) while development happens on macOS, so
# the point of this pass is proving the workspace builds and tests clean on the deployment platform
# rather than only on the machine it was written on.
#
# This replaced a GStreamer-specific "Build Linux" workflow - cargo-c build, gst-inspect smoke test
# and plugin artifact upload - which went when the GStreamer element did.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
