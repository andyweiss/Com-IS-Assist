name: Build Linux

# Deployment target is Linux (Specs/TechnicalConcept.md section 1) while development happens on
# macOS - this workflow is the actual Linux build/test pass: cargo test across the workspace, then
# building com-is-assist-gstreamer's cdylib via cargo-c (the same tool used locally) and a smoke check
# that GStreamer can actually load and describe the resulting plugin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GStreamer and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            libsndfile1

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-c binary
        id: cargo-c-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-cbuild
          # Bump this key if cargo-c ever needs a forced reinstall (e.g. version bump).
          key: cargo-c-${{ runner.os }}-v0.10.24

      - name: Install cargo-c
        if: steps.cargo-c-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-c --locked

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build the GStreamer plugin (cargo-c)
        working-directory: crates/com-is-assist-gstreamer
        run: cargo cbuild --release

      - name: Smoke-test the built plugin with gst-inspect-1.0
        run: |
          PLUGIN_DIR="target/x86_64-unknown-linux-gnu/release"
          echo "GST_PLUGIN_PATH=$PLUGIN_DIR" >> "$GITHUB_ENV"
          GST_PLUGIN_PATH="$PLUGIN_DIR" gst-inspect-1.0 comisassist

      - name: Upload built plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgstcomisassist-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/libgstcomisassist.so
          if-no-files-found: error
